# =============================================================================
# Hourly streamflow modelling in Andean paramo catchments: Tambo and Chalpi
# Common settings come first; each site (bottom) overrides what differs, and each site
# defines its own experiments. Select a site with PARAMO_SITE=<name> (run_pipeline.py
# --site does it for you) and an experiment with PARAMO_EXPERIMENT=<name>.
# =============================================================================

project:
  name: paramo
  default_site: tambo
  local_timezone: "America/Guayaquil"   # UTC-5, no daylight saving
  # FONAG/EPMAPS station records label each hour at the START of the interval
  # (verified in stage 05 against extraterrestrial radiation at both sites).
  station_time_label: start

crs:
  tmq: "+proj=tmerc +lat_0=0 +lon_0=-78.5 +k=1.0004584 +x_0=500000 +y_0=10000000 +ellps=WGS84 +units=m +no_defs"
  geographic: "EPSG:4326"
  utm: "EPSG:32717"

# {site} is replaced by the site name; experiments append _<experiment> to processed,
# tables and figures
paths:
  input: data/{site}_input
  interim: data/interim/{site}
  raw_gee: data/raw/{site}/gee
  raw_dem: data/raw/{site}/dem
  dem_tiles: data/raw/dem_tiles          # Copernicus tiles shared by both sites
  natural_earth: data/raw/naturalearth
  processed: data/processed/{site}
  tables: outputs/{site}/tables
  figures: outputs/{site}/figures
  synthesis: outputs/synthesis
  logs: outputs/logs

stations:
  file: estaciones.txt

# Key (accents removed) that identifies each variable in the input file names
variables:
  precipitation: {file_key: "precipit", unit: "mm"}
  discharge:     {file_key: "caudal",   unit: "m3/s"}
  stage:         {file_key: "nivel",    unit: "cm"}
  temperature:   {file_key: "temperatura", unit: "degC"}
  radiation:     {file_key: "radiaci",  unit: "W/m2"}

quality_control:
  completeness_min: 80.0     # % of sub-hourly records required for a valid hour
  precipitation: {max_hourly: 40.0, flat_hours: 6, flat_min_mm: 0.5}
  temperature:   {range: [-10.0, 25.0], max_step: 8.0, flat_hours: 6}
  radiation:     {range: [0.0, 1400.0], flat_hours: 6}
  discharge:     {window_hours: 72, z_max: 6.0, spike_factor: 2.0, flat_hours: 48}
  stage:         {window_hours: 72, z_max: 6.0, spike_factor: 2.0, flat_hours: 48}

aggregation:
  min_hours_day: 20
  min_days_month: 25
  min_annual_completeness: 80

dem:
  base_url: "https://copernicus-dem-30m.s3.amazonaws.com"
  resolution_m: 30
  stream_threshold_cells: 1000
  snap_radius_m: 300
  hand_threshold_cells: 1000
  glacier_elevation_m: 4800
  countries_url: "https://naciscdn.org/naturalearth/50m/cultural/ne_50m_admin_0_countries.zip"

gee:
  project: "chirpschalpi"          # replace with your own Google Cloud project with Earth Engine access
  drive_folder: "paramo_gee"
  period: ["2003-07-01", "2026-01-01"]
  polygon_scale_m: 1000
  workers: 4
  products:
    imerg:
      collection: "NASA/GPM_L3/IMERG_V07"
      bands: ["precipitation"]                  # mm/h, 30 min
      scale_m: 11132
      time_label: start
      conversion: {precipitation: [1.0, 0.0]}
    gsmap:
      collection: "JAXA/GPM_L3/GSMaP/v8/operational"
      bands: ["hourlyPrecipRate"]               # mm/h, 1 h
      scale_m: 11132
      time_label: start
      conversion: {hourlyPrecipRate: [1.0, 0.0]}
    era5land:
      collection: "ECMWF/ERA5_LAND/HOURLY"
      bands: ["total_precipitation_hourly", "temperature_2m",
              "surface_solar_radiation_downwards_hourly"]
      scale_m: 11132
      time_label: end                           # verified in stage 05
      conversion:
        total_precipitation_hourly: [1000.0, 0.0]              # m -> mm
        temperature_2m: [1.0, -273.15]                         # K -> degC
        surface_solar_radiation_downwards_hourly: [0.000277778, 0.0]   # J/m2 -> W/m2

harmonization:
  test_lags_h: [-3, -2, -1, 0, 1, 2, 3]

# ----------------------------------------------------------------------------- modelling
# Data coverage of every period is checked by verify.py against the station records
# (minimum valid fraction of hourly discharge and of the gauge network).
period_checks:
  min_discharge_fraction: 0.70
  min_gauge_fraction: 0.65
  max_length_ratio: 1.6            # longer/shorter of effective calibration and validation

bias_correction:               # stage 06
  products: [imerg, gsmap, era5land]
  fusion: true
  qm_reference: true           # same two-scale mapping without ML, propagated as {product}_qm
  min_validation_hours: 2000   # gauges with fewer hours in validation are trained on but not scored
  wet_threshold_mm: 0.1
  lags_h: [-3, -2, -1, 0, 1, 2, 3]   # p(t+k): positive k are hours after the target hour
  windows_h: [3, 6, 24]        # centred sums (24 h reaches t+11 h): retrospective (offline) use
  tweedie_power: 1.5
  quantiles: 200
  tail_ratio_max: 3.0
  lgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: 4
    deterministic: true
    force_row_wise: true
    verbose: -1

forcing:                       # stage 07
  lapse_rate_c_per_km: -6.0
  hypsometry_bands: 101
  gauge_qc:
    window_months: 12
    moving_ratio_min: 0.70
    moving_ratio_max: 1.43
    ratio_min: 0.40
    ratio_max: 2.50
    min_expected_mm: 30

gr4h:                          # stage 08 (R, airGR)
  models: [GR4H]
  mask_window_h: 72            # hours after a precipitation gap excluded for every scenario
  workers: 4

lstm:                          # stage 09 (PyTorch)
  structures: [LSTM]           # add LSTM_hybrid to also run the hybrid LSTM
  seeds: 3
  hidden: 64
  dropout: 0.3
  learning_rate: 0.001
  max_epochs: 200
  patience: 25
  validate_every: 2
  spinup_h: 720
  window_h: 336
  batch: 16
  workers: 2                   # parallel scenarios; threads per worker = cores / workers

gbm:                           # stage 10 (LightGBM)
  models: [GBM, GR4H_GBM]
  seeds: 3
  precipitation_windows_h: [1, 3, 6, 12, 24, 72, 168, 720]
  api_k: [0.9, 0.99, 0.999]
  early_stopping_rounds: 100
  lgbm:
    n_estimators: 3000
    learning_rate: 0.02
    num_leaves: 15
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    n_jobs: 4
    deterministic: true
    force_row_wise: true
    verbose: -1

analysis:                      # stage 11
  structures: [GR4H, LSTM, GBM, GR4H_GBM]
  supplementary: [LSTM_raw, LSTM_hybrid]
  reference_structure: GR4H
  reference_forcing: gauge
  bootstrap_replicates: 1000
  block_h: 720                 # 30-day moving blocks
  seed: 2026
  dm_lag_days: 10
  shap_scenarios: [gauge, fusion_corr]

sensitivity:                   # stage 12 (evaluation only, nothing is retrained)
  metrics: [kge, kge_daily, nse, nse_log, kge_sqrt]
  block_lengths_h: [360, 720, 1440]
  bootstrap_replicates: 500
  obs_realizations: 300
  obs_systematic: 0.15         # rating-curve bias, uniform in [-0.15, 0.15]
  obs_rho: 0.999               # slowly varying error (AR(1), about 40 days)
  obs_sd_low: 0.25             # Q < Q10
  obs_sd_mid: 0.10
  obs_sd_high: 0.20            # Q > Q90
  seed: 7
  postprocessing_variants:     # D: ANOVA with the variance adjustment (Eq. 4) as reported,
    reported: [GR4H, LSTM, GBM, GR4H_GBM]               # on no structure,
    none: [GR4H, LSTM_raw, GBM_raw, GR4H_GBM_raw]       # and on all four
    all: [GR4H_adj, LSTM, GBM, GR4H_GBM]
  forcing_subsets:             # E: ANOVA on subsets of the forcings (full design first)
    all: [gauge, imerg_raw, imerg_corr, gsmap_raw, gsmap_corr, era5land_raw, era5land_corr,
          fusion_raw, fusion_corr]
    without_raw: [gauge, imerg_corr, gsmap_corr, era5land_corr, fusion_corr]

# ============================================================================= sites
sites:
  tambo:
    label: Tambo
    stations:
      streamflow: [H18, H20]           # transfer (nested) first, then calibration
      rain_gauges: [C01, P39, P40]     # gauges used to train and score the bias correction
      weather: [C01]                   # temperature and radiation
    dem:
      bbox_geographic: [-78.60, -0.95, -78.01, -0.40]
    map:
      label_offsets: {H18: [6, 4], P40: [-6, -10], H20: [6, 4], C01: [6, 4], P39: [6, 4]}
    # H20 is the main catchment (stable annual Q/P). H18 is used only for transfer because its
    # annual Q/P rises under a single rating curve. Data after July 2015 are excluded
    # (Cotopaxi unrest from August 2015).
    periods:
      warmup:      ["2007-01-01", "2007-12-31"]
      calibration: ["2008-01-01", "2011-12-31"]
      validation:  ["2012-01-01", "2015-07-31"]
      transfer:    ["2010-01-01", "2014-12-31"]
    bias_correction:
      training_periods:                # never inside the hydrological validation period
        - ["2003-07-01", "2011-12-31"]
        - ["2016-01-01", "2025-12-31"]
    forcing:
      catchments: [H18, H20]
      temperature_station: C01
      thiessen_gauges: [C01, P39, P40]
    gr4h:
      calibration_catchment: H20
      transfer_catchment: H18
    lstm:
      stop_period: ["2011-01-01", "2011-12-31"]   # inside calibration
    experiments:
      reversed:                        # differential split-sample test (Klemeš, 1986)
        periods:
          calibration: ["2012-01-01", "2015-07-31"]
          validation:  ["2008-01-01", "2011-12-31"]
        bias_correction:
          training_periods:
            - ["2003-07-01", "2007-12-31"]
            - ["2012-01-01", "2025-12-31"]
        lstm:
          stop_period: ["2014-08-01", "2015-07-31"]

  chalpi:
    label: Chalpi
    stations:
      streamflow: [H42, H13]
      # P74 and P75 start in December 2018: they train and score the satellite correction
      # but cannot enter the areal precipitation of the modelled period
      rain_gauges: [C16, P46, P64, M5022, P74, P75]
      weather: [M5022, C16, M5025]     # temperature (M5022); radiation for the solar anchor
    dem:
      bbox_geographic: [-78.32, -0.45, -77.95, -0.12]
    gee:
      period: ["2005-01-01", "2026-01-01"]   # station records and bias-correction training start in 2005
    map:
      label_offsets: {H13: [6, -10], P46: [-6, 4], H42: [6, 4], P75: [-6, 4], C16: [6, 4],
                      P64: [6, 4], P74: [6, 4], M5022: [6, 4], M5023: [6, 4],
                      M5025: [6, 4], H38: [6, 4], H39: [-6, 4]}
    quality_control:
      # Documented sensor faults, flagged as errors in stage 01. Evidence: the two nested gauges
      # keep a stable discharge ratio H13/H42 of about 16-18 (area ratio 16.1); in these windows
      # the ratio leaves that range for weeks and one gauge stops responding to rain.
      manual_exclusions:
        # H42 rises steadily while H13 recedes, then recedes smoothly through weeks of
        # 40-120 mm of rain; ratio H13/H42 falls to 2-8 and the 30-day correlation to about 0
        - {series: H42_discharge, start: "2013-03-11 00:00", end: "2013-10-24 23:00",
           reason: "level drift without rain response"}
        # H13 rises about 0.25 m3/s per day through dry weather and drops 30-55 % within one
        # hour on 21 October and 8 November (sensor resets); ratio H13/H42 reaches 40-118
        - {series: H13_discharge, start: "2018-09-17 00:00", end: "2018-11-08 01:00",
           reason: "saw-tooth drift with abrupt resets"}
        # H42 drops 40 % in one hour and stays within 2 % for 23 days while it rains
        - {series: H42_discharge, start: "2018-10-22 17:00", end: "2018-11-15 15:00",
           reason: "level stuck after an abrupt step"}
        # H13 drops to a flat ~2.2 m3/s within hours on 3-4 March and stops responding to
        # rain (280 mm in April) while H42 does; ratio H13/H42 falls to 2-8 and the 30-day
        # correlation to -0.45; only 8-10 hourly records per day from 21 April
        - {series: H13_discharge, start: "2016-03-04 00:00", end: "2016-06-07 23:00",
           reason: "flat level without rain response"}
    # H13 discharge is usable to December 2018: January-May 2019 is missing and a level shift
    # follows in June 2019. The gauge network (C16, P46, P64, M5022) is complete from late
    # 2011. H42 (nested, no 2019 shift) is the transfer catchment.
    periods:
      warmup:      ["2011-01-01", "2011-12-31"]
      calibration: ["2012-01-01", "2015-12-31"]
      validation:  ["2016-01-01", "2018-12-31"]
      transfer:    ["2012-01-01", "2018-12-31"]
    bias_correction:
      training_periods:
        - ["2005-01-01", "2015-12-31"]
        - ["2019-01-01", "2025-12-31"]
    forcing:
      catchments: [H42, H13]
      temperature_station: M5022
      thiessen_gauges: [C16, P46, P64, M5022]   # M5023 excluded: other valley, ~half the rainfall
    gr4h:
      calibration_catchment: H13
      transfer_catchment: H42
    lstm:
      stop_period: ["2015-01-01", "2015-12-31"]
    experiments:
      reversed:
        periods:
          calibration: ["2016-01-01", "2018-12-31"]
          validation:  ["2012-01-01", "2015-12-31"]
        bias_correction:
          training_periods:
            - ["2005-01-01", "2011-12-31"]
            - ["2016-01-01", "2025-12-31"]
        lstm:
          stop_period: ["2018-01-01", "2018-12-31"]
